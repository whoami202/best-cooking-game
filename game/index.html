<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lantern Kitchen — a tiny restaurant cooking game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <noscript><p style="text-align:center">The Lantern Kitchen needs JavaScript to cook.</p></noscript>
  <div id="test-results"></div>
  <p id="help">Move with WASD or arrow keys. Click a station to walk over and use it.
  Chop, cook, plate, serve — before the tickets run out. M mutes, P pauses.</p>
</div>
<script src="src/config.js"></script>
<script src="src/audio.js"></script>
<script src="src/state.js"></script>
<script src="src/input.js"></script>
<script src="src/logic.js"></script>
<script src="src/render.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
